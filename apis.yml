- aid: euronet:dandelion-cross-border-payments-api
  name: Dandelion Cross-Border Payments API
  description: >-
    Dandelion by Euronet — a real-time, ISO 20022-compliant cross-border
    payments network exposed through a single customizable API reaching 190+
    countries, ~6 billion bank accounts and mobile wallets, and 550,000+ cash
    pickup locations. It powers payout orders (bank deposit, mobile wallet, cash
    pickup) for fintechs, banks, ERPs, and platforms, and underpins Euronet's own
    Ria and Xe brands. The developer portal is live but the API console is
    login-gated, so no downloadable OpenAPI/Swagger was available at review time.
  humanURL: https://public.dandelionpayments.com/
