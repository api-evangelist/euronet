openapi: 3.2.0
info:
  title: Xe Currency Data Mid-market Rates API
  description: 'Xe Currency Data - Integrate your application with our globally trusted currency data.


    Get your free API credentials for 7 days here'
  version: '1.0'
servers:
- url: https://xecdapi.xe.com
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Mid-market Rates
paths:
  /v1/convert_from:
    get:
      tags:
      - Mid-market Rates
      summary: Convert from one base currency to one or multiple counter currencies
      description: 'In the example below, the Convert FROM API query endpoint is to convert from GBP to all available currencies (the asterisk * represents ALL currencies).

        https://xecdapi.xe.com/v1/convert_from.csv/?from=GBP&to=*&amount=1'
      parameters:
      - name: from
        in: query
        description: OPTIONAL – Currency you want to convert from ISO code. Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: to
        in: query
        description: 'Comma separated list of to currencies ISO 4217 codes.  This will limit the data returned to only those currencies you are interested in. Use an asterisk * to convert all currencies.</br> Note: Obsolete currencies are replaced by their successor currency.</br>'
        required: true
        schema:
          type: string
      - name: amount
        in: query
        description: OPTIONAL – This parameter can be used to specify the amount you want to convert, if an amount is not specified then 1 is assumed.</br>
        schema:
          type: number
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: interval
        in: query
        description: OPTIONAL – Using one of the interval values below in your call request will return rates for that specific interval.</br></br>"daily" - Returns the latest daily rate at your pre-chosen daily lock-in time</br>"hourly" - Returns rates for the most recent hour</br>"15minutes" - Returns rates for the most recent 15 minute period</br>"minutely" - Returns rates for the most recent minute</br></br>If omitted, we’ll default to your fastest rate frequency (i.e. live, 15-min, hourly, then daily) as per your subscription plan.
        schema:
          type: string
      - name: inverse
        in: query
        description: 'OPTIONAL – If ‘true’ then endpoint will include inverse rates. An inverse rate is a quote for which the base currency and counter currency are switched. An inverse is calculated by dividing one by the exchange rate. Example: If the exchange rate for $1 USD to EUR = 0.874852, then the inverse rate would be 1/0.874852 = 1.14305, meaning that US$1.14305 would buy 1 euro.'
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: margin
        in: query
        description: 'OPTIONAL – This parameter can be used to add a margin (-/+)  to XE''s mid-market rate. Example: add margin=2.05 parameter to the endpoint and the API will return our mid-market rates plus the margin of 2.05 percent.'
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.'
        schema:
          type: boolean
      - name: skip_weekends
        in: query
        description: OPTIONAL - Applicable to queries with rate intervals faster than daily. If 'true' then requests during the weekend will respond with the rate as of market close (Friday, 5pm America/New_York).
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            ETag:
              schema:
                type: string
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            Last-Modified:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertFromResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                from: GBP
                amount: 1.0
                timestamp: '2026-09-24T14:25:00Z'
                to:
                - quotecurrency: EUR
                  mid: 1.1623050132
                - quotecurrency: USD
                  mid: 1.32212641
        '304':
          description: Not Modified
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            ETag:
              schema:
                type: string
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            Last-Modified:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 42
                message: 'Invalid interval requested: BOGUS'
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1ConvertFrom
      x-operation-id-source: derived
  /v1/convert_to:
    get:
      tags:
      - Mid-market Rates
      summary: Convert to a currency amount from one or multiple other currencies
      description: 'In the example below, the Convert TO API query endpoint is to convert to GBP from all available currencies (the asterisk * represents ALL currencies).

        https://xecdapi.xe.com/v1/convert_to.csv/?to=GBP&from=*&amount=1'
      parameters:
      - name: from
        in: query
        description: 'Comma separated list of to currencies ISO codes.  This will limit the data returned to only those currencies you are interested in. Use an asterisk * to convert all currencies.</br> Note: Obsolete currencies are replaced by their successor currency.</br>'
        required: true
        schema:
          type: string
      - name: to
        in: query
        description: OPTIONAL - Currency you want to convert to ISO code.  Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: amount
        in: query
        description: OPTIONAL – This parameter can be used to specify the amount you want to convert, if an amount is not specified then 1 is assumed.</br>
        schema:
          type: number
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: interval
        in: query
        description: OPTIONAL – Using one of the interval values below in your call request will return rates for that specific interval.</br></br>"daily" - Returns the latest daily rate at your pre-chosen daily lock-in time</br>"hourly" - Returns rates for the most recent hour</br>"15minutes" - Returns rates for the most recent 15 minute period</br>"minutely" - Returns rates for the most recent minute</br></br>If omitted, we’ll default to your fastest rate frequency (i.e. live, 15-min, hourly, then daily) as per your subscription plan.
        schema:
          type: string
      - name: inverse
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display the inverse of the converted value. If ‘false‘ then it will not be displayed.
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: margin
        in: query
        description: 'OPTIONAL – This parameter can be used to add a margin (-/+)  to XE''s mid-market rate. Example: add margin=2.05 parameter to the endpoint and the API will return our mid-market rates plus the margin of 2.05 percent.'
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.'
        schema:
          type: boolean
      - name: skip_weekends
        in: query
        description: OPTIONAL - Applicable to queries with rate intervals faster than daily. If 'true' then requests during the weekend will respond with the rate as of market close (Friday, 5pm America/New_York).
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            ETag:
              schema:
                type: string
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            Last-Modified:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertToResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                to: GBP
                amount: 1.0
                timestamp: '2026-09-24T14:25:00Z'
                from:
                - quotecurrency: EUR
                  mid: 1.1623050132
                - quotecurrency: USD
                  mid: 1.32212641
        '304':
          description: Not Modified
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            ETag:
              schema:
                type: string
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            Last-Modified:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 42
                message: 'Invalid interval requested: BOGUS'
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1ConvertTo
      x-operation-id-source: derived
  /v1/historic_rate:
    get:
      tags:
      - Mid-market Rates
      summary: Get historic rates for one base currency against one or more counter currencies
      description: 'The Currency Data API provides you with access to daily historical rates back to 1998. When retrieving historical rates through our Currency Data API, you would specify your requested currencies along with the date and/or date range and time (hh:mm). Minutely and 15 minute rates are available for the past 7 days. Outside of 7 days you have access to rates on the hour. Historical rates are available with all API packages. The time parameter (hh:mm) is applicable only for packages with access to rate updates faster than daily.

        The endpoint returns the historic rate for a single base currency and one or more counter currencies.


        https://xecdapi.xe.com/v1/historic_rate.csv/?from=USD&date=2011-03-05&to=CAD,EUR'
      parameters:
      - name: from
        in: query
        description: OPTIONAL – Currency you want to convert from ISO code.</br>Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: to
        in: query
        description: 'Comma separated list of to currencies ISO 4217 codes.</br>This will limit the data returned to only those currencies you are interested in. Use an asterisk * to specify all currencies.</br> Note: Obsolete currencies are replaced by their precursor or successor currency.</br>'
        required: true
        schema:
          type: string
      - name: amount
        in: query
        description: OPTIONAL – This parameter can be used to specify the amount you want to convert, if an amount is not specified then 1.00 is assumed.</br>
        schema:
          type: number
      - name: date
        in: query
        description: OPTIONAL - UTC date should be in the form of YYYY-MM-DD, back to 1995-11-16.</br></br>If your account is registered to receive daily rates only, the default time value used is 00:00 UTC, or your daily lock-in time if one is set.</br></br>Otherwise the endpoint will return the latest rates for your chosen date.
        schema:
          type: string
      - name: time
        in: query
        description: OPTIONAL – *Time parameter is only applicable to packages with access to rate frequencies faster than daily.*</br></br>UTC time is in format of HH:MM
        schema:
          type: string
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: inverse
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display the inverse of the converted value. If ‘false‘ then it will not be displayed.
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: margin
        in: query
        description: 'OPTIONAL – This parameter can be used to add a margin (-/+)  to XE''s mid-market rate. Example: add margin=2.05 parameter to the endpoint and the API will return our mid-market rates plus the margin of 2.05 percent.'
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.


          <i>Note: Historical crypto data varies by currency. Most start from May 2022 onward.</i>'
        schema:
          type: boolean
      - name: use_lock_in_time
        in: query
        description: OPTIONAL - If ‘true’ then this endpoint will display rates using your daily lock in rate time (any value set for the time will be ignored).
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricRateResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                from: USD
                amount: 1.0
                timestamp: '2026-09-20T00:00:00Z'
                to:
                - quotecurrency: EUR
                  mid: 0.8706371278
                - quotecurrency: GBP
                  mid: 0.7465807902
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 11
                message: Date 2099-01-01T00:00:00Z is in future
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 1
                message: Bad credentials
                documentation_url: https://developers.xe.com/docs/currency-data-api
            text/plain:
              schema:
                type: string
              example: 'Endpoint not authorized. Feature missing: HISTORIC_RATES'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1HistoricRate
      x-operation-id-source: derived
  /v1/historic_rate/period:
    get:
      tags:
      - Mid-market Rates
      summary: Get historic rates for one base currency against one or more counter currencies…
      description: 'This endpoint returns a daily historic rate for a single base currency and one or more counter currencies over a period of time.


        https://xecdapi.xe.com/v1/historic_rate/period.csv/?from=USD&to=CAD&start_timestamp=2017-09-01&end_timestamp=2017-11-30&per_page=30'
      parameters:
      - name: from
        in: query
        description: OPTIONAL – Currency you want to convert from ISO code. Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: to
        in: query
        description: 'Comma separated list of to currencies based on ISO 4217 codes.</br>This will limit the data returned to only those currencies you are interested in.</br> Note: Obsolete currencies are replaced by their precursor or successor currency.</br>'
        required: true
        schema:
          type: string
      - name: amount
        in: query
        description: OPTIONAL – This parameter can be used to specify the amount you want to convert, if an amount is not specified then 1.00 is assumed.</br>
        schema:
          type: number
      - name: start_timestamp
        in: query
        description: OPTIONAL - ISO 8601 timestamp in the format yyyy-mm-ddThh:mm giving the UTC date and time of the start of the period for which you would like rates returned.</br></br>If you’re querying using a daily interval, the time value will be ignored & the endpoint will return rates at your preferred daily lock-in time starting on the date specified in your request. If your account does not have a preferred daily lock-in time then rates will return as of 00:00 UTC.</br>If you’re querying using a faster rate interval than daily rate interval, your endpoint will return rates starting at 00:00 UTC if no time portion is specified.</br>
        schema:
          type: string
      - name: end_timestamp
        in: query
        description: OPTIONAL – ISO 8601 timestamp in the format yyyy-mm-ddThh:mm giving the UTC date and time of the end of the period for which you would like rates returned. If a time in the future is specified, the current time will be used. If no end_time is specified, the time specified in the “start_timestamp" parameter will also be used for the "end_timestamp".</br>If your query is using a daily rate interval, your endpoint will return rates at your preferred daily lock-in time ending on the date specified in your request. If your account does not have a preferred daily lock-in time then rates will return as of 00:00 UTC.</br>If your query is using a faster rate interval than daily, your endpoint will return daily rates at your specified lock-in time or 00:00 UTC by default, unless you specify a time parameter in your rate request.
        schema:
          type: string
      - name: interval
        in: query
        description: OPTIONAL – Using one of the interval values below in your call request will return rates for that specific interval.</br></br>"daily" - Returns one rate for the days specified in your time period</br>"hourly" - Returns rates for every hour in the time period you specify</br>"15minutes" - Returns rates for each 15 minute interval in the time period you specify, available for 7 days from current date</br>”minutely” - Returns minutely rates for the time period, available for 7 days from current date</br></br>If omitted, "daily" is used. This parameter is only used if both the "start_timestamp" and "end_timestamp" parameters have been specified.
        schema:
          type: string
      - name: page
        in: query
        description: 'OPTIONAL – You can specify the page number you want to request.</br>Note: that page numbering is 1-based (the first page being page 1).</br>Omitting this parameter will return the first page.</br>'
        schema:
          type: number
      - name: per_page
        in: query
        description: OPTIONAL – You can specify the number of days per page. The default is 30 days of rates per page with a maximum of 500 days of rates per page.</br>
        schema:
          type: number
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: inverse
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display the inverse of the converted value. If ‘false‘ then it will not be displayed.
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: margin
        in: query
        description: 'OPTIONAL – This parameter can be used to add a margin (-/+)  to XE''s mid-market rate. Example: add margin=2.05 parameter to the endpoint and the API will return our mid-market rates plus the margin of 2.05 percent.'
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.


          <i>Note: Historical crypto data varies by currency. Most start from May 2022 onward.</i>'
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricRatePeriodResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                from: USD
                amount: 1.0
                to:
                  EUR:
                  - mid: 0.8711750189
                    timestamp: '2026-09-18T03:00:00Z'
                  - mid: 0.870650765
                    timestamp: '2026-09-19T03:00:00Z'
                  GBP:
                  - mid: 0.7485201486
                    timestamp: '2026-09-18T03:00:00Z'
                  - mid: 0.7466271079
                    timestamp: '2026-09-19T03:00:00Z'
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 12
                message: 'Date range error: start date 2026-01-01T00:00:00Z is after end date 2020-01-01T00:00:00Z'
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 1
                message: Bad credentials
                documentation_url: https://developers.xe.com/docs/currency-data-api
            text/plain:
              schema:
                type: string
              example: 'Endpoint not authorized. Feature missing: HISTORIC_RATES'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1HistoricRatePeriod
      x-operation-id-source: derived
  /v1/monthly_average:
    get:
      tags:
      - Mid-market Rates
      summary: Get monthly average rates for a single base currency and one or more counter…
      description: The monthly average endpoint returns monthly average rates for a single base currency and one or more counter currency for the year you specify in your API query. The monthly average rate is calculated by taking the 00:00 UTC Daily rate for each day in the month/year you specify in your query. Months are returned as a numeric value from 1 to 12 where 1 is for January and 12 is for December. If no month is provided, then all months for the given year are returned.
      parameters:
      - name: from
        in: query
        description: OPTIONAL – Currency you want to convert from ISO code. Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: to
        in: query
        description: Comma separated list of to currencies based on ISO 4217 codes. This will limit the data returned to only those currencies that are specified.</br>
        required: true
        schema:
          type: string
      - name: amount
        in: query
        description: OPTIONAL – This parameter can be used to specify the amount you want to convert, if an amount is not specified then 1 is assumed.</br>
        schema:
          type: number
      - name: year
        in: query
        description: OPTIONAL – This parameter specifies the year to calculate average monthly rates.</br>
        schema:
          type: number
      - name: month
        in: query
        description: OPTIONAL – This parameter specifies the month in the given year to return average monthly rates. This is a numeric value from 1 to 12 where 1 is for January and 12 is for December. If no month is provided, then all months for the given year are returned.</br>
        schema:
          type: number
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: inverse
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will include inverse rates.
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.'
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyAverageResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                from: USD
                amount: 1.0
                year: 2026
                to:
                  EUR:
                  - monthlyAverage: 0.8524468275
                    month: 1
                    daysInMonth: 31
                  - monthlyAverage: 0.8454772824
                    month: 2
                    daysInMonth: 28
                  GBP:
                  - monthlyAverage: 0.7401499218
                    month: 1
                    daysInMonth: 31
                  - monthlyAverage: 0.7360488046
                    month: 2
                    daysInMonth: 28
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 15
                message: Month 13 in the year 2026 is invalid
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1MonthlyAverage
      x-operation-id-source: derived
  /v1/stats:
    get:
      tags:
      - Mid-market Rates
      summary: Gets an average rate over the specified time period, as well various additional…
      description: 'The stats endpoint returns average rates for a single base currency and one or more counter currencies over the time period you specify in your API query. Note that, unlike the monthly_average endpoint, you specify exact start and end dates, which provides a heightened level of control. This can be quite useful if you want statistics for bi-monthly averages or any other intervals of time.


        This endpoint also provides several other statistics: the highest and lowest rate over the period (and their respective timestamps), the average rate, the standard deviation, volatility, and the number of data points over this period.


        To provide some background to how we obtain our statistics, volatility is measured by applying the standard deviation of the logarithmic daily returns, expressed in a percentage score. We calculate daily returns using the values of two consecutive days and measure the gain or loss of a currency pair (for live rate frequency packages this comparison is done at 00:00 UTC; daily rate frequency packages will compute stats based on the rate lock-in time specified on the account). Then, we apply a logarithm to the ratio between those two values (Ex: ln (valueDay2 / valueDay1) is the logarithmic return between day2 and day1). As for the standard deviation, we apply it to the daily logarithmic returns we calculated during the given time period. When applicable, values are expressed as a percentage so they are already multiplied by 100.'
      parameters:
      - name: from
        in: query
        description: OPTIONAL – Currency you want to convert from ISO code. Note if this parameter is omitted, default is USD.</br>
        schema:
          type: string
      - name: to
        in: query
        description: Comma separated list of to currencies based on ISO 4217 codes. This will limit the data returned to only those currencies that are specified.</br>
        required: true
        schema:
          type: string
      - name: start_date
        in: query
        description: OPTIONAL – ISO 8601 timestamp in the format yyyy-mm-dd giving the UTC date of the start of the period for which you would like to compute the volatility from. Note if this parameter is omitted, the start date will default to today.</br>
        schema:
          type: string
      - name: end_date
        in: query
        description: OPTIONAL – ISO 8601 timestamp in the format yyyy-mm-dd giving the UTC date of the end of the period for which you would like to compute the volatility to. Note if this parameter is omitted, the end date will default to today.</br>
        schema:
          type: string
      - name: obsolete
        in: query
        description: OPTIONAL – If ‘true’ then endpoint will display rates for currencies that are obsolete. If ‘false’ then obsolete currencies are replaced by their successor currency.
        schema:
          type: boolean
      - name: decimal_places
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of decimal places included in the output. Example 1 USD to EUR = 0.874852 with decimal_places=3, the output returned will be EUR = 0.875
        schema:
          type: number
      - name: daysInPeriod
        in: query
        description: OPTIONAL – This parameter can be used to specify the number of days in the period that we are considering.
        schema:
          type: number
      - name: crypto
        in: query
        description: 'OPTIONAL – If ''true'' then this endpoint will return data for the following crypto currencies: ADA, ARB, AVAX, BCH, BNB, BTC, DAI, DOGE, DOT, ETH, EURC, LINK, LTC, LUNA, POL, SOL, TRX, UNI, USDC, USDP, USDT, XLM and XRP.'
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
              example:
                terms: https://www.xe.com/legal
                privacy: https://www.xe.com/privacy
                from: USD
                stats:
                - to: EUR
                  high: 0.8745684278
                  low: 0.8560159877
                  average: 0.8635891576
                  standardDeviation: 0.0051467066
                  volatility: 0.2196459934
                  highTimestamp: '2026-09-23T03:00:00Z'
                  lowTimestamp: '2026-08-24T03:00:00Z'
                  dataPoints: 31
                - to: GBP
                  high: 0.7505032122
                  low: 0.7326068831
                  average: 0.7405660819
                  standardDeviation: 0.0046295646
                  volatility: 0.2322828624
                  highTimestamp: '2026-09-23T03:00:00Z'
                  lowTimestamp: '2026-08-24T03:00:00Z'
                  dataPoints: 31
        '400':
          description: Bad Request
          headers:
            X-RateRequest-Remaining:
              schema:
                type: number
            X-RateLimit-Remaining:
              schema:
                type: number
            X-RateRequest-Reset:
              schema:
                type: number
            X-RateLimit-Reset:
              schema:
                type: number
            X-RateLimit-Limit:
              schema:
                type: number
            X-RateRequest-Limit:
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 12
                message: 'Date range error: start date 2026-01-01T00:00:00Z is after end date 2020-01-01T00:00:00Z'
                documentation_url: https://developers.xe.com/docs/currency-data-api
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getV1Stats
      x-operation-id-source: derived
