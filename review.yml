aid: euronet
name: Euronet Worldwide
review:
  question: Does Euronet Worldwide expose a real public developer surface, and can any OpenAPI/Swagger be harvested?
  answer: true
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: United States
findings:
  summary: >-
    Euronet Worldwide (NASDAQ: EEFT, Leawood, Kansas) is a US payments holding
    company across three segments — Payments Infrastructure (EFT/ATM, processing,
    acquiring, REN software), epay (prepaid/digital media), and Money Transfer
    (Ria, Xe, Dandelion). Consistent with the fragmented US market (no single
    payments mandate), Euronet does not publish one unified platform API; instead
    its developer surface is distributed across brands. The most API-native brand
    is Xe, whose SwaggerHub organization (XE.com) publishes five real, downloadable
    Swagger 2.0 definitions — all harvested verbatim into openapi/. Dandelion by
    Euronet runs a live cross-border developer portal (public.dandelionpayments.com)
    but its API console is login-gated, so no Dandelion spec was downloadable. No
    public Postman workspace, GraphQL, gRPC/.proto, or AsyncAPI was found. The
    corporate REN software (Euronet Software Solutions) is licensed enterprise
    software, not a self-serve public API.
  developerPortals:
    - name: Dandelion developer portal
      url: https://public.dandelionpayments.com/
      httpStatus: 200
      note: Live Vue SPA API console; login-gated. ISO 20022-compliant cross-border payout API. No downloadable OpenAPI at common paths (/openapi.json, /swagger.json return a GenericException error envelope, not a spec).
    - name: Xe Currency Data API docs
      url: https://xecdapi.xe.com/docs/v1/
      httpStatus: 200
      note: Slate-style JS docs. Base URL https://xecdapi.xe.com/v1 confirmed live (401 without credentials). HTTP Basic auth (account id + API key). 7-day free-trial self-serve signup.
    - name: Xe Payments API product page
      url: https://www.xe.com/platform/payments-api/
      httpStatus: 200
      note: Partner/sales-onboarded cross-border payments with a sandbox environment.
    - name: XE.com SwaggerHub organization
      url: https://app.swaggerhub.com/apis/XE.com
      httpStatus: 200
      note: Public SwaggerHub org listing five published API definitions (source of harvested specs).
  downloadableSpecs:
    count: 5
    format: Swagger 2.0
    provenance:
      - file: openapi/xe-currency-data-api-openapi.json
        title: XE Currency Data API 1.0.2
        source: https://api.swaggerhub.com/apis/XE.com/xecdapi/1.0.2/swagger.json
        httpStatus: 200
        fetched: '2026-07-24'
        host: xecdapi.xe.com
        basePath: /v1
        auth: HTTP Basic (basicAuth)
        paths: 8
      - file: openapi/xe-payments-api-openapi.json
        title: Xe.Api.Payments 1.3.0
        source: https://api.swaggerhub.com/apis/XE.com/xe-api_payments/1.3.0/swagger.json
        httpStatus: 200
        fetched: '2026-07-24'
        host: none declared in spec
        auth: none declared in spec
        paths: 10
      - file: openapi/xe-mass-payments-api-openapi.json
        title: Xe.Api.MassPayments 0.4.1
        source: https://api.swaggerhub.com/apis/XE.com/xe-api_mass_payments/0.4.1/swagger.json
        httpStatus: 200
        fetched: '2026-07-24'
        host: none declared in spec
        auth: none declared in spec
        paths: 11
      - file: openapi/xe-currency-data-tradable-rates-api-openapi.json
        title: XE Currency Data Tradable Rates API 1.0.0
        source: https://api.swaggerhub.com/apis/XE.com/xecdapi-tradable/1.0.0/swagger.json
        httpStatus: 200
        fetched: '2026-07-24'
        host: virtserver.swaggerhub.com (SwaggerHub mock; no production host declared)
        auth: none declared in spec
        paths: 1
      - file: openapi/xeta-api-openapi.json
        title: XETA v1.0.0
        source: https://api.swaggerhub.com/apis/XE.com/xeta/v1.0.0/swagger.json
        httpStatus: 200
        fetched: '2026-07-24'
        host: xeta-api.xe.com (declared; not publicly reachable at review time)
        basePath: /v1
        auth: xeta-drupal-authorizer
        paths: 16
  authModel:
    - api: Xe Currency Data API
      scheme: HTTP Basic (account id + API key)
      confirmed: true
      note: securityDefinitions.basicAuth in spec; live host returns 401 without credentials.
    - api: Dandelion Cross-Border Payments API
      scheme: Login-gated portal credentials (partner onboarding); not publicly documented
      confirmed: false
    - api: Xe Payments / Mass Payments / XETA
      scheme: Not declared in the published SwaggerHub definitions (partner onboarding)
      confirmed: false
  webhooksEvents:
    found: false
    note: No public webhook/event catalog or AsyncAPI located for Xe or Dandelion at review time; Dandelion documents SWIFT InterAct + HTTPS + SFTP delivery channels behind login.
  postman:
    found: false
  graphql:
    found: false
  grpc:
    found: false
  railsPosture:
    iso20022: true
    note: Dandelion is explicitly ISO 20022-compliant (supports pacs.008 / pacs.002 over SWIFT InterAct, plus a direct HTTPS endpoint and private SFTP). This is scheme/rail messaging, not a self-serve REST spec.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://xecdapi.xe.com/v1
      documented: true
      note: Xe Currency Data API; confirmed live (401 unauthenticated).
    - protocol: REST
      scheme: https
      documented: true
      note: Xe Payments, Mass Payments, XETA, Tradable Rates — Swagger 2.0 published on SwaggerHub; production hosts not all declared.
    - protocol: REST
      scheme: https
      baseURL: https://public.dandelionpayments.com/
      documented: true
      note: Dandelion cross-border payout API; console login-gated, no downloadable spec.
    - protocol: ISO20022
      scheme: swift-interact/sftp/https
      documented: true
      note: Dandelion supports SWIFT ISO 20022 (pacs.008/pacs.002) plus direct HTTPS and SFTP channels.
sources:
