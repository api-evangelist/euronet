aid: euronet
url: https://raw.githubusercontent.com/api-evangelist/euronet/refs/heads/main/apis.yml
name: Euronet Worldwide
kind: company
description: >-
  Euronet Worldwide (NASDAQ: EEFT) is a US-based (Leawood, Kansas) global
  payments and financial technology company operating across three segments:
  Payments Infrastructure (EFT/ATM networks, transaction processing, merchant
  acquiring, and the REN payments software from Euronet Software Solutions);
  epay (prepaid and digital-media distribution across 60+ countries); and Money
  Transfer, home to its Ria, Xe, and Dandelion brands. The company processes
  roughly 20 billion transactions a year across 200 countries and territories.
  Its most API-native surface sits in the Money Transfer segment: the Xe brand
  publishes several developer APIs on SwaggerHub (Currency Data, Payments, Mass
  Payments, Tradable Rates, and XETA), and Dandelion operates a real-time,
  ISO 20022-compliant cross-border payments developer portal. As a US company in
  a market with no single payments mandate, Euronet exposes a fragmented but
  genuine set of self-serve (Xe Currency Data free trial) and partner-onboarded
  (Payments, Dandelion) developer surfaces rather than one unified platform API.
