apis:
- aid: euronet:xe-currency-data-api
  name: Xe Currency Data API
  description: >-
    Xe (a Euronet Money Transfer brand) Currency Data API — a REST JSON API
    serving real-time and historical exchange rates for 170+ currencies from
    100+ global sources. Documented Swagger 2.0 with HTTP Basic authentication
    (account id + API key). Endpoints cover account info, currencies,
    convert_from, convert_to, historic rates, historic period, monthly average,
    and usage stats.
  humanURL: https://xecdapi.xe.com/docs/v1/
  baseURL: https://xecdapi.xe.com/v1
