actions:
  specsHarvested: 5
  specsDir: openapi/
  apisYmlUpdated: true
  reason: >-
    Five real Swagger 2.0 definitions from Xe's public SwaggerHub organization
    were saved verbatim and listed as separate apis[] entries; Dandelion is
    represented as a real documented API without a harvested spec because its
    console is login-gated. No fabricated hosts, endpoints, scopes, or specs.
